[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillvm"
version = "0.1.0"
description = "Compile natural-language agent skills into typed, verified workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "google-genai>=1.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillvm = "skillvm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
tmp_path_retention_policy = "none"
tmp_path_base = ".pytest_tmp"
markers = [
  "live: live provider tests skipped without credentials",
]
